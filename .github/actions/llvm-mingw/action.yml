name: Install LLVM-MinGW
description: Download a pinned LLVM-MinGW release, check its digest and export its root as LLVM_MINGW.
inputs:
  release:
    description: LLVM-MinGW release tag with digests recorded below
    required: true
runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        RELEASE: ${{ inputs.release }}
      run: |
        $ErrorActionPreference = 'Stop'
        # Published GitHub release asset digests for 20261104.
        if ($env:RELEASE -ne '20261104') { throw 'No digests recorded for this LLVM-MinGW release' }
        $arch, $hash = switch ($env:RUNNER_ARCH) {
          'X64' { 'x86_64', '552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f' }
          'ARM64' { 'aarch64', '7d7f8387a8706639b0b47a629d6e23f8b3ef9acce67e9832b8cd4c5bb2816eab' }
          default { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
        }
        $name = "llvm-mingw-$env:RELEASE-ucrt-$arch"
        $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
        $destination = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
        Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:RELEASE/$name.zip" -OutFile $archive
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
          throw 'LLVM-MinGW archive integrity check failed'
        }
        Expand-Archive -LiteralPath $archive -DestinationPath $destination
        $root = Join-Path $destination $name
        if (!(Test-Path -LiteralPath (Join-Path $root 'bin/clang.exe'))) { throw 'LLVM-MinGW compiler missing' }
        "LLVM_MINGW=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
