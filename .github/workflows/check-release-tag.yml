name: Check release tag

# `make release` pushes a signed version tag on a commit whose go.mod requires
# that release's native modules, then publishes the release. This flags a tag
# that is unsigned or does not pair its Go module with a published release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  NODE_VERSION: '22.18.0'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dist/metadata-proxy/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the tag requires its own native modules
        working-directory: dist/metadata-proxy
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run --silent release:check-version -- "$GITHUB_REF_NAME"
          npm run --silent release:check-tag -- "$GITHUB_REF_NAME"
      - name: Check the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')"
          if [[ "${ref%% *}" != tag ]]; then
            echo "Tag $GITHUB_REF_NAME is lightweight; release tags are signed annotated tags" >&2
            exit 1
          fi
          # GitHub verifies signatures from signing keys registered on the tagger's account.
          verification="$(gh api "repos/$GH_REPO/git/tags/${ref#* }" --jq '.verification.verified, .verification.reason' | paste -sd ' ' -)"
          if [[ "$verification" != "true valid" ]]; then
            echo "Tag $GITHUB_REF_NAME does not have a verified signature: $verification" >&2
            exit 1
          fi
      - name: Check the native release is published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `make release` publishes the draft right after pushing the tag.
          for attempt in $(seq 30); do
            if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Release $GITHUB_REF_NAME is missing or still a draft after 5 minutes" >&2
          exit 1
