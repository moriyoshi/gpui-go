name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: dist/metadata-proxy/package-lock.json
      - name: Check distribution scripts and metadata Worker
        working-directory: dist/metadata-proxy
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make harness-check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '35.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make test
      - run: go vet ./...
      - run: go test -race -tags gpui_e2e ./...
      - run: make e2e-check
      - run: make test-gox-tools check-gox-generated
      - run: make check-generated
  sable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '35.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make integration
      - run: make showcase-headless-smoke
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '35.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make test-native
      - run: make test-e2e-native
      - run: make build-e2e build-uitest
      - run: make build build-showcase build-features build-reactive build-counter-gox
  native-linux-no-display:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '35.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install native libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev cmake fontconfig fonts-dejavu-core \
            libfontconfig1-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libzstd-dev
      - run: make uitest
      - run: make e2e-no-display
